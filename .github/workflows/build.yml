# build
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'test/**'
      - 'Examples/**'

name: KingpinNet
jobs:
  build-and-test:
    name: Test and Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing exchanges the GitHub OIDC token for a short-lived API key
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Build Test Pack
        shell: bash
        run: |
          dotnet restore
          sed 's/9999/'"${{github.run_number}}"'/g' src/KingpinNet/KingpinNet.csproj > src/KingpinNet/KingpinNet.final.csproj
          cp src/KingpinNet/KingpinNet.final.csproj src/KingpinNet/KingpinNet.csproj
          dotnet build --configuration Release
          dotnet test --configuration Release --no-build --logger "junit;LogFilePath=results.xml"
          dotnet pack src/KingpinNet/KingpinNet.csproj

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: UtopleMan

      - name: Push
        shell: bash
        run: dotnet nuget push ./src/KingpinNet/source/workspace/packages/KingpinNet.*.nupkg -k ${{steps.nuget-login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json

  aot-gate:
    name: AOT and single-file publish gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore

      - name: AOT publish example app
        shell: bash
        run: |
          set -e
          for TFM in net10.0 net11.0; do
            OUTPUT=$(dotnet publish Examples/Ping/Ping.csproj \
              -c Release -f $TFM -r linux-x64 --self-contained \
              -p:PublishAot=true 2>&1)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -E "warning IL[0-9]+|error"; then
              echo "::error::AOT publish for $TFM produced warnings or errors"
              exit 1
            fi
          done

      - name: Single-file publish example app
        shell: bash
        run: |
          set -e
          for TFM in net10.0 net11.0; do
            OUTPUT=$(dotnet publish Examples/Ping/Ping.csproj \
              -c Release -f $TFM -r linux-x64 --self-contained \
              -p:PublishSingleFile=true -p:PublishAot=false 2>&1)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -E "warning IL[0-9]+"; then
              echo "::error::Single-file publish for $TFM produced IL warnings"
              exit 1
            fi
          done
